[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["reference"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
authors = ["SchemCraft contributors"]

[workspace.dependencies]
# internal
schemcraft-core = { path = "crates/core" }
schemcraft-format = { path = "crates/format" }
schemcraft-netlist = { path = "crates/netlist" }
schemcraft-engine = { path = "crates/engine" }
schemcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
